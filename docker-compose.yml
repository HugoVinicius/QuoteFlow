version: '3.8'

services:
  # INFRASTRUCTURE
  postgres:
    image: postgres:16-alpine
    container_name: qflow-db
    environment:
      POSTGRES_DB: quoteflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: qflow-cache
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: qflow-mq
    ports:
      - "5672:5672"
      - "15672:15672"

  # BACKEND SERVICES
  auth-service:
    image: openjdk:21-slim
    container_name: qflow-auth
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quoteflow
      JWT_SECRET: ${JWT_SECRET:-default_secret_key_change_me}

  core-service:
    image: openjdk:21-slim
    container_name: qflow-core
    depends_on:
      - postgres
      - redis

  billing-service:
    image: openjdk:21-slim
    container_name: qflow-billing
    depends_on:
      - postgres
      - rabbitmq

volumes:
  postgres_data:
